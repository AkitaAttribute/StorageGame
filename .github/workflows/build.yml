name: Windows and Android preview build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: storage-game-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/export-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Stamp embedded preview build number
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("project.godot")
          old = 'config/version="0.1.0"'
          new = 'config/version="0.1.%s"' % (int(os.environ["GITHUB_RUN_NUMBER"]) + 1)
          data = path.read_text(encoding="utf-8")
          if old not in data:
              raise RuntimeError("Missing embedded version setting.")
          path.write_text(data.replace(old, new, 1), encoding="utf-8")
          print(new)
          PY

      - name: Set up Node.js for glTF conversion
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch licensed game assets
        run: python3 tools/fetch_assets.py

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader|SPIR-V compilation failed|ERROR: Error importing|ERROR: glTF:|ERR_PARSE_ERROR" /tmp/godot-import.log; then
            echo "Godot reported script or shader compilation errors during import."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-runtime.log; then
            echo "Godot reported script or shader errors while starting the game."
            exit 1
          fi

      - name: Verify fresh executable supersedes old installed resource packs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/update_manager.gd").read_text()
          must_have = [
              "var installed_build := int(installed.get(\"build\", 0))",
              "var bundled_build := _embedded_build()",
              "installed_build <= bundled_build",
          ]
          for item in must_have:
              if item not in script:
                  raise SystemExit("Missing recovery compatibility check: " + item)
          print("Verified updated Windows and Android binaries ignore older PCK updates.")
          PY

      - name: Updater transaction smoke test
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$(mktemp -d)"
          timeout 30s godot --headless --path . --script res://tools/updater_smoke.gd 2>&1 | tee /tmp/storage-updater-smoke.log
          grep -F UPDATER_SMOKE_PASS /tmp/storage-updater-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/storage-updater-smoke.log; then exit 1; fi

      - name: Game and save-state smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . -- --storage-smoke 2>&1 | tee /tmp/storage-smoke.log
          grep -F STORAGE_SMOKE_PASS /tmp/storage-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/storage-smoke.log; then exit 1; fi

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/StorageGame.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-export.log; then
            echo "Godot reported script or shader errors during export."
            exit 1
          fi
          test -s build/StorageGame.exe
          ls -lh build/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: StorageGame-Windows-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore persistent Android development signing key
        id: android-signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .android-signing
          key: storage-game-android-development-signing-v1

      - name: Create Android development signing key once
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .android-signing
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore .android-signing/storage-game-development.keystore \
            -storepass android \
            -alias storagegamedevelopment \
            -keypass android \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Storage Game Development,O=AkitaAttribute,C=US"

      - name: Save Android development signing key
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-signing
          key: storage-game-android-development-signing-v1

      - name: Verify Android signing identity
        shell: bash
        run: |
          set -euxo pipefail
          test -s .android-signing/storage-game-development.keystore
          "$JAVA_HOME/bin/keytool" -list -v \
            -keystore .android-signing/storage-game-development.keystore \
            -storepass android \
            -alias storagegamedevelopment \
            | grep -E "Alias name:|SHA256:|Valid from:"

      - name: Set Android build version
        shell: bash
        run: |
          set -euxo pipefail
          version_code="$((GITHUB_RUN_NUMBER + 1))"
          version_name="0.1.${version_code}"
          sed -i -E "s/^version\/code=[0-9]+$/version\/code=${version_code}/" export_presets.cfg
          sed -i -E "s/^version\/name=\"[^\"]*\"$/version\/name=\"${version_name}\"/" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android-signing/storage-game-development.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: storagegamedevelopment
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/StorageGame-Android.apk 2>&1 | tee /tmp/godot-android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Shader compilation failed|Failed to compile shader" /tmp/godot-android-export.log; then
            echo "Godot reported errors during Android export."
            exit 1
          fi
          test -s build/StorageGame-Android.apk
          ls -lh build/StorageGame-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: StorageGame-Android-${{ github.sha }}
          path: build/StorageGame-Android.apk
          if-no-files-found: error
          retention-days: 14

      # The normal Actions artifacts require GitHub authentication. Publish
      # downloadable resource packs and a small version manifest as release
      # assets so the installed Android/Windows game can check anonymously.
      - name: Export resource packs for in-place updates
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-pack "Windows Desktop" build/StorageGame-Windows.pck
          godot --headless --path . --export-pack "Android" build/StorageGame-Android.pck
          test -s build/StorageGame-Windows.pck
          test -s build/StorageGame-Android.pck
          ls -lh build/*.pck

      - name: Create preview update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = "https://github.com/AkitaAttribute/StorageGame/releases/download/preview"
          build_dir = Path("build")
          manifest = {
              "channel": "storage-preview",
              "build": int(os.environ["GITHUB_RUN_NUMBER"]) + 1,
              "commit": os.environ["GITHUB_SHA"],
          }
          for platform, filename in [
              ("windows", "StorageGame-Windows.pck"),
              ("android", "StorageGame-Android.pck"),
          ]:
              path = build_dir / filename
              manifest[platform] = {
                  "url": f"{base}/{filename}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
          (build_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish public preview resource packs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=preview
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Storage Game Preview Updates" \
              --notes "Automatically refreshed Godot resource packs for the main development branch. Install the current Windows or Android build once to enable in-app patches."
          fi
          gh release upload "$tag" \
            build/StorageGame-Windows.pck \
            build/StorageGame-Android.pck \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Upload the manifest last, only once both downloadable packs exist.
          gh release upload "$tag" build/manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Publish complete reinstallable builds as a recovery route when a
          # bad PCK prevents the in-app updater from opening. Android uses the
          # persistent signing key and ascending versionCode, allowing an
          # in-place update that preserves user:// saves and settings.
          gh release upload "$tag" \
            build/StorageGame.exe \
            build/StorageGame-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
